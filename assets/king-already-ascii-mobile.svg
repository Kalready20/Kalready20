<style>
 @keyframes reveal { from {opacity:.24;transform:translateY(6px)} to {opacity:1;transform:translateY(0)} }
 @keyframes caret {0%,48%{opacity:1}49%,80%{opacity:0}81%,100%{opacity:1}}
 @keyframes scan {0%{transform:translateY(-22px);opacity:0}10%{opacity:.52}85%{opacity:.52}100%{transform:translateY(370px);opacity:0}}
 .details {animation:reveal .9s ease-out both}
 .caret {animation:caret 1.4s steps(1,end) infinite}
 .scanline {animation:scan 7s linear infinite}
 @media (prefers-reduced-motion:reduce){.details,.caret,.scanline{animation:none!important} .scanline{opacity:0!important}}
</style>
