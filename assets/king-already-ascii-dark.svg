</defs>
<style>
@keyframes cursor { 0%,45% {opacity:1} 46%,80% {opacity:.15} 81%,100% {opacity:1} }
@keyframes enter { from {opacity:.18; transform:translateY(7px)} to {opacity:1; transform:translateY(0)} }
@keyframes scan {0% {transform:translateY(-30px);opacity:0} 15%{opacity:.55} 85%{opacity:.55} 100%{transform:translateY(370px);opacity:0}}
.cursor {animation:cursor 1.8s steps(1,end) infinite}
.info {animation:enter 1s ease-out both}
.scan {animation:scan 7s linear infinite}
@media (prefers-reduced-motion:reduce) {.cursor,.info,.scan {animation:none!important;opacity:1!important} .scan{opacity:0!important}}
</style>
